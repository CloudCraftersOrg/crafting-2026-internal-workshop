name: Validate

# Sanity-check syntax and structure on PRs to main and on the main branch
# itself. No AWS interaction, no apply — just terraform validate / fmt and
# Python compile.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -diff
      - name: terraform init -backend=false
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check Python sources
        run: |
          python -m py_compile $(find app/src -name '*.py')
          python -m py_compile app/invoke_agent.py
