name: Deploy team infra

on:
  push:
    branches:
      - gryffindor
      - slytherin
      - ravenclaw
      - hufflepuff
      - hogsmeade
      - diagon
      - gringotts

# One apply per team at a time. If a team pushes twice quickly, the second push
# waits for the first to finish — prevents Terraform state-lock contention.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write       # required for OIDC token request to AWS
  contents: write       # required to post commit comments with deployment outputs
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5.0"
  STATE_BUCKET: cloudcrafters-workshop-2026-tfstate

jobs:
  deploy:
    name: terraform apply for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # All seven team branches share the same workshop AWS credentials
    # (repo-level secrets). Teams are isolated by resource naming +
    # team-scoped Terraform state, not by IAM identity.

    steps:
      - name: Checkout team branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (team-scoped state)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=workshop-2026/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="team_id=${{ github.ref_name }}"

      - name: Capture outputs
        id: tf
        working-directory: terraform
        run: |
          terraform output -json > /tmp/outputs.json
          echo "agent_runtime_arn=$(jq -r '.agent_runtime_arn.value' /tmp/outputs.json)" >> $GITHUB_OUTPUT
          echo "knowledge_base_id=$(jq -r '.knowledge_base_id.value' /tmp/outputs.json)" >> $GITHUB_OUTPUT
          echo "memory_id=$(jq -r '.memory_id.value' /tmp/outputs.json)" >> $GITHUB_OUTPUT
          echo "log_group=$(jq -r '.agent_execution_log_group.value' /tmp/outputs.json)" >> $GITHUB_OUTPUT

      - name: Comment commit with deployment details
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `### ✅ Deployed for team \`${{ github.ref_name }}\``,
              ``,
              `Paste these into your local \`app/.env\` to test the agent:`,
              ``,
              '```ini',
              `AWS_REGION=us-east-1`,
              `MODEL_ID=us.amazon.nova-pro-v1:0`,
              `MEMORY_ID=${{ steps.tf.outputs.memory_id }}`,
              `MEMORY_ACTOR_ID=${{ github.ref_name }}`,
              `KNOWLEDGE_BASE_ID=${{ steps.tf.outputs.knowledge_base_id }}`,
              `AGENT_RUNTIME_ARN=${{ steps.tf.outputs.agent_runtime_arn }}`,
              '```',
              ``,
              `Logs: \`${{ steps.tf.outputs.log_group }}\``,
            ].join('\n');
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
